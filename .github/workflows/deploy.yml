name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  discussion:
    types:
      - created
      - edited
      - deleted
  discussion_comment:
    types:
      - created
      - edited
      - deleted

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  discussions: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Inkcairn
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/inkcairn" \
            https://github.com/so1ve/inkcairn/releases/latest/download/inkcairn-x86_64-unknown-linux-gnu
          chmod +x "$RUNNER_TEMP/inkcairn"

      - name: Build site
        run: |
          "$RUNNER_TEMP/inkcairn" build .
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Wrangler
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-wrangler-v4

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
